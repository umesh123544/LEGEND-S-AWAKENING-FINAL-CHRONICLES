  <!-- Sword blade -->
  <rect x="243" y="118" width="26" height="220" rx="8" fill="url(#blade)"/>
  <!-- Sword crossguard -->
  <rect x="196" y="318" width="120" height="22" rx="8" fill="url(#gold)"/>
  <!-- Sword hilt -->
  <rect x="243" y="336" width="26" height="56" rx="8" fill="url(#gold)"/>

  <!-- Glow core -->
